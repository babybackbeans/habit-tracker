<!DOCTYPE html>
<html>
<head>
  <title>Habit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">  <link rel="stylesheet" href="style.css?v=11">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=DM+Sans:wght@400;700&family=Poppins:wght@300&display=swap" rel="stylesheet">
</head>
<body>

<div id="debug-overlay"></div>

<div class="screen-wrapper" data-screen="home-screen">
  <div class="screen" id="home-screen">
    <div class="page-header">
      <div class="header-left"></div>
      <h1>Home</h1>
      <div class="header-right"></div>
    </div>
    <button onclick="renderDayView(getToday()); showScreen('day-view-screen')">Today</button>
    <button onclick="showScreen('habits-screen')">Habits</button>
    <button onclick="showScreen('status-screen')">Log</button>
    <button onclick="renderCalendar(); showScreen('calendar-screen')">Calendar</button>
  </div>
</div>

<div class="screen-wrapper" style="display:none" data-screen="habits-screen">
  <div class="screen" id="habits-screen">
    <div class="page-header">
      <div class="header-left"><button onclick="showScreen('home-screen')" class="icon-nav-btn"><span class="home-icon-slot"></span></button></div>
      <h1>Habits</h1>
      <div class="header-right"><button onclick="renderDayView(getToday()); showScreen('day-view-screen')" class="icon-nav-btn"><span class="today-icon-slot"></span></button></div>
    </div>
    <div id="habit-list"></div>
  </div>
</div>

<div class="screen-wrapper" data-screen="status-screen">
  <div class="screen" id="status-screen">
    <div class="page-header">
      <div class="header-left"><button onclick="showScreen('home-screen')" class="icon-nav-btn"><span class="home-icon-slot"></span></button></div>
      <h1 id="status-header"></h1>
      <div class="header-right"><button onclick="renderDayView(getToday()); showScreen('day-view-screen')" class="icon-nav-btn"><span class="today-icon-slot"></span></button></div>
    </div>
    <div class="empty-box"></div>
    <div class="screen-content">
      <div id="energy-section"></div>
      <div id="mood-section"></div>
    </div>
    <div class="bottom-nav">
      <button onclick="showScreen('health-screen')">Go to Health</button>
    </div>
  </div>
</div>

<div class="screen-wrapper" style="display:none" data-screen="health-screen">
  <div class="screen" id="health-screen">
    <div class="page-header">
      <div class="header-left"><button onclick="showScreen('home-screen')" class="icon-nav-btn"><span class="home-icon-slot"></span></button></div>
      <h1 id="health-header"></h1>
      <div class="header-right"><button onclick="renderDayView(getToday()); showScreen('day-view-screen')" class="icon-nav-btn"><span class="today-icon-slot"></span></button></div>
    </div>
    <div class="empty-box" id="health-date-box"></div>
    <div class="screen-content">
      <div id="general-section"></div>
      <div id="menstrual-section"></div>
    </div>
    <div class="bottom-nav">
      <button onclick="showScreen('status-screen')">Go to Status</button>
    </div>
  </div>
</div>

<div class="screen-wrapper" style="display:none" data-screen="done-screen">
  <div class="screen" id="done-screen">
    <div class="page-header">
      <div class="header-left"><button onclick="showScreen('home-screen')" class="icon-nav-btn"><span class="home-icon-slot"></span></button></div>
      <h1>Done!</h1>
      <div class="header-right"></div>
    </div>
    <button onclick="renderDayView(currentLogDate); showScreen('day-view-screen')">View Today</button>
    <button onclick="showScreen('home-screen')">Home</button>
  </div>
</div>

<div class="screen-wrapper" style="display:none" data-screen="day-view-screen">
  <div class="screen" id="day-view-screen">
    <div class="page-header">
      <div class="header-left"><button onclick="showScreen('home-screen')" class="icon-nav-btn"><span class="home-icon-slot"></span></button></div>
      <h1 id="day-view-header"></h1>
      <div class="header-right"><button onclick="renderCalendar(); showScreen('calendar-screen')" class="icon-nav-btn"><span class="calendar-icon-slot"></span></button></div>
    </div>
    <div id="day-view-content"></div>
  </div>
</div>

<div class="screen-wrapper" style="display:none" data-screen="calendar-screen">
  <div class="screen" id="calendar-screen">
    <div class="page-header">
      <div class="header-left"><button onclick="showScreen('home-screen')" class="icon-nav-btn"><span class="home-icon-slot"></span></button></div>
      <h1>Calendar</h1>
      <div class="header-right"><button onclick="renderDayView(getToday()); showScreen('day-view-screen')" class="icon-nav-btn"><span class="today-icon-slot"></span></button></div>
    </div>
    <div id="calendar-content"></div>
  </div>
</div>

<div id="item-action-overlay" class="item-action-overlay" style="display:none" onclick="closeItemActionPrompt()">
  <div class="item-action-sheet" onclick="event.stopPropagation()">
    <button class="item-action-btn" onclick="confirmItemActionEdit()">Edit</button>
    <button class="item-action-btn item-action-delete" onclick="confirmItemActionDelete()">Delete</button>
    <button class="item-action-btn item-action-cancel" onclick="closeItemActionPrompt()">Cancel</button>
  </div>
</div>

<div id="item-editor-overlay" class="item-action-overlay" style="display:none" onclick="closeItemEditor()">
  <div class="item-editor-sheet" onclick="event.stopPropagation()">
    <input type="text" id="item-editor-name-input" class="item-editor-name-input">
    <div id="item-editor-swatches" class="item-editor-swatches"></div>
    <div class="item-editor-actions">
      <button class="item-action-btn" onclick="saveItemEditor()">Save</button>
      <button class="item-action-btn item-action-cancel" onclick="closeItemEditor()">Cancel</button>
    </div>
  </div>
</div>

  <script src="main.js?v=11"></script>
  <script src="navigation.js?v=11"></script>
  <script src="storage.js?v=11"></script>
  <script src="habits.js?v=11"></script>
  <script src="mood.js?v=11"></script>
  <script src="menstrual.js?v=11"></script>
  <script src="general.js?v=11"></script>
  <script src="calendar.js?v=11"></script>
  <script src="dayview.js?v=11"></script>
  <script src="script.js?v=11"></script>
</body>
</html>
